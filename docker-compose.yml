version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinews_learn_db
    environment:
      POSTGRES_USER: sentinews
      POSTGRES_PASSWORD: sentinews_password
      POSTGRES_DB: sentinews_learn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinews -d sentinews_learn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
